name: Ошибка
description: Неверный результат команды, исключение или падение
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Что происходит
      description: Что вы ожидали и что получили
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести
      description: Команда с аргументами, текст, на котором проявляется ошибка, и вывод команды или полный traceback
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версии ruTS-adapt и ruTS
      description: "`uv run ruts-adapt --version`"
      placeholder: "ruts-adapt 0.1.0, ruts 0.16.0"
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Настройки модели
      description: Переменные окружения RUTS_ADAPT_*, если они заданы
      placeholder: "RUTS_ADAPT_JUDGE_EFFORT=max"
  - type: input
    id: environment
    attributes:
      label: Python и ОС
      placeholder: "Python 3.12, macOS 15"
    validations:
      required: true
