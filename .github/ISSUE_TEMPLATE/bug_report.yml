name: Ошибка
description: Неверный результат команды, исключение или падение
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Что происходит
      description: Что вы ожидали и что получили
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести
      description: Команда с аргументами, текст, на котором проявляется ошибка, и вывод команды или полный traceback
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия ruTS-adapt
      description: "`uv run ruts-adapt --version`"
      placeholder: "ruts-adapt 0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python и ОС
      placeholder: "Python 3.12, macOS 15"
    validations:
      required: true
